name: Tree-sitter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tree-sitter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the generated parser is current
        run: |
          nix run nixpkgs#tree-sitter -- generate --abi 14 --js-runtime native
          git diff --exit-code

      - name: Run the corpus tests
        run: nix run nixpkgs#tree-sitter -- test
